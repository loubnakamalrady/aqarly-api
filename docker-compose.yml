# Local Postgres for development. `docker compose up -d` starts it in the
# background; `docker compose down` stops it and keeps the data;
# `docker compose down -v` also deletes the data volume.
name: aqarly-api

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aqarly
      POSTGRES_PASSWORD: aqarly
      POSTGRES_DB: aqarly
    ports:
      - "5432:5432"
    volumes:
      # A named volume, so the data survives the container being recreated.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aqarly -d aqarly"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
